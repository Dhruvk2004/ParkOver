# Free on GitHub-hosted Linux runners because this repo is public.
# Runs what doesn't need a phone: unit tests, a compile check of the device/E2E tests,
# and the Firestore rules + load tests on the local Firebase emulator. No secrets are used:
# local.properties isn't in the repo, so the build gets empty ORS/dev-login values.
# Device tests and E2E stay on a developer machine (scripts/run-device-tests.sh, run-e2e.sh).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Unit tests + compile device tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (debug and release) and androidTest compile
        run: ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest compileDebugAndroidTestKotlin
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  firestore:
    name: Firestore rules + load (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4 # the Firebase emulator needs Java 21+
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json
      - name: Cache the Firebase emulator download
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.24.0
      - run: npm ci
      - run: npm install -g firebase-tools@15.24.0
      - name: Rules tests
        run: npm test
      - name: Load scenarios (shorter sustained run on CI)
        run: npm run load
        env:
          LOAD_SECONDS: 20
